<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0e14;
    --surface: #13171f;
    --surface2: #1c2130;
    --border: #252c3d;
    --accent: #4f8ef7;
    --accent2: #f7934f;
    --accent3: #4ff7a0;
    --accent4: #f74f7a;
    --text: #e8eaf0;
    --muted: #6b7490;
    --font-display: 'Bebas Neue', cursive;
    --font-body: 'Noto Sans KR', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 배경 그리드 효과 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(79,142,247,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,142,247,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrapper { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 32px 24px; }

  /* 헤더 */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .logo-area h1 {
    font-family: var(--font-display);
    font-size: 52px;
    letter-spacing: 4px;
    line-height: 1;
    color: var(--text);
  }
  .logo-area h1 span { color: var(--accent); }
  .logo-area p { font-size: 12px; color: var(--muted); letter-spacing: 3px; margin-top: 4px; text-transform: uppercase; }
  .header-right { text-align: right; }
  .last-updated { font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  #status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent3);
    margin-right: 6px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* 로딩 */
  #loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
    transition: opacity 0.5s;
  }
  .loader-text {
    font-family: var(--font-display);
    font-size: 32px;
    letter-spacing: 6px;
    color: var(--accent);
    margin-bottom: 24px;
  }
  .loader-bar {
    width: 200px; height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .loader-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    animation: load 1.4s ease-in-out infinite;
  }
  @keyframes load {
    0% { width: 0; margin-left: 0; }
    50% { width: 80%; margin-left: 10%; }
    100% { width: 0; margin-left: 100%; }
  }

  /* KPI 카드 */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s, transform 0.5s, border-color 0.3s;
  }
  .kpi-card:hover { border-color: var(--accent); }
  .kpi-card.show { opacity: 1; transform: translateY(0); }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .kpi-card:nth-child(1)::before { background: var(--accent); }
  .kpi-card:nth-child(2)::before { background: var(--accent2); }
  .kpi-card:nth-child(3)::before { background: var(--accent3); }
  .kpi-card:nth-child(4)::before { background: var(--accent4); }
  .kpi-card:nth-child(5)::before { background: #c97ef7; }
  .kpi-card:nth-child(6)::before { background: #f7e24f; }

  .kpi-label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .kpi-value {
    font-family: var(--font-display);
    font-size: 38px;
    letter-spacing: 2px;
    line-height: 1;
  }
  .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 8px; }

  /* 차트 섹션 */
  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  .charts-grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s, transform 0.5s, border-color 0.3s;
  }
  .chart-card:hover { border-color: var(--border); }
  .chart-card.show { opacity: 1; transform: translateY(0); }
  .chart-card.full { grid-column: 1 / -1; }

  .section-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .section-title {
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 2px;
    margin-bottom: 20px;
  }

  canvas { max-height: 260px; }

  /* 재고 테이블 */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    padding: 10px 14px;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    font-weight: 400;
  }
  td {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(37,44,61,0.5);
    font-weight: 300;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(79,142,247,0.04); }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1px;
  }
  .badge-ok  { background: rgba(79,247,160,0.12); color: var(--accent3); }
  .badge-warn{ background: rgba(247,147,79,0.12); color: var(--accent2); }
  .badge-bad { background: rgba(247,79,122,0.12); color: var(--accent4); }

  /* 담당자 랭킹 */
  .rep-list { display: flex; flex-direction: column; gap: 12px; }
  .rep-item { display: flex; align-items: center; gap: 12px; }
  .rep-rank {
    font-family: var(--font-display);
    font-size: 20px;
    color: var(--muted);
    width: 28px;
    text-align: center;
  }
  .rep-rank.top { color: var(--accent2); }
  .rep-info { flex: 1; }
  .rep-name { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
  .rep-bar-wrap { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .rep-bar { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent3)); transition: width 1s ease; }
  .rep-amount { font-family: var(--font-display); font-size: 15px; color: var(--accent); white-space: nowrap; }

  /* 반응형 */
  @media (max-width: 900px) {
    .charts-grid, .charts-grid-3 { grid-template-columns: 1fr; }
    .logo-area h1 { font-size: 36px; }
  }
  @media (max-width: 600px) {
    header { flex-direction: column; align-items: flex-start; gap: 12px; }
  }
</style>
</head>
<body>

<!-- 로딩 -->
<div id="loading">
  <div class="loader-text">LOADING</div>
  <div class="loader-bar"><div class="loader-fill"></div></div>
</div>

<div class="wrapper">
  <!-- 헤더 -->
  <header>
    <div class="logo-area">
      <h1>SALES <span>DASH</span></h1>
      <p>Business Intelligence Dashboard</p>
    </div>
    <div class="header-right">
      <div class="last-updated">
        <span id="status-dot"></span>
        <span id="update-time">데이터 로딩 중...</span>
      </div>
    </div>
  </header>

  <!-- KPI -->
  <div class="kpi-grid" id="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">총 판매 건수</div><div class="kpi-value" id="kpi-orders">—</div><div class="kpi-sub">전체 주문 기준</div></div>
    <div class="kpi-card"><div class="kpi-label">총 매출액</div><div class="kpi-value" id="kpi-revenue">—</div><div class="kpi-sub">원 (할인 반영)</div></div>
    <div class="kpi-card"><div class="kpi-label">총 판매수량</div><div class="kpi-value" id="kpi-qty">—</div><div class="kpi-sub">개</div></div>
    <div class="kpi-card"><div class="kpi-label">평균 주문금액</div><div class="kpi-value" id="kpi-avg">—</div><div class="kpi-sub">원 / 건</div></div>
    <div class="kpi-card"><div class="kpi-label">재고 주의</div><div class="kpi-value" id="kpi-lowstock">—</div><div class="kpi-sub">안전재고 1.5배 미만</div></div>
    <div class="kpi-card"><div class="kpi-label">재주문 필요</div><div class="kpi-value" id="kpi-reorder">—</div><div class="kpi-sub">안전재고 미달</div></div>
  </div>

  <!-- 차트 1행 -->
  <div class="charts-grid">
    <div class="chart-card">
      <div class="section-label">TREND</div>
      <div class="section-title">월별 매출</div>
      <canvas id="chart-monthly"></canvas>
    </div>
    <div class="chart-card">
      <div class="section-label">BREAKDOWN</div>
      <div class="section-title">카테고리별 매출</div>
      <canvas id="chart-category"></canvas>
    </div>
  </div>

  <!-- 차트 2행 -->
  <div class="charts-grid-3">
    <div class="chart-card">
      <div class="section-label">CHANNEL</div>
      <div class="section-title">판매 채널</div>
      <canvas id="chart-channel"></canvas>
    </div>
    <div class="chart-card" style="grid-column: span 2;">
      <div class="section-label">PERFORMANCE</div>
      <div class="section-title">담당자별 실적</div>
      <div class="rep-list" id="rep-list"></div>
    </div>
  </div>

  <!-- 재고 현황 -->
  <div class="chart-card" style="margin-bottom: 0;">
    <div class="section-label">STOCK</div>
    <div class="section-title">재고 현황</div>
    <div class="table-wrap">
      <table id="inventory-table">
        <thead>
          <tr>
            <th>제품코드</th><th>제품명</th><th>카테고리</th>
            <th>현재재고</th><th>안전재고</th><th>총입고</th><th>총출고</th><th>상태</th>
          </tr>
        </thead>
        <tbody id="inventory-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxPyDJXVTEtaGHlFaqwMbvyY8AMOxQO2Yx_x24rWO7L3_4IlTzc-j1Y-lkNad19uGz5/exec';

const COLORS = ['#4f8ef7','#f7934f','#4ff7a0','#f74f7a','#c97ef7','#f7e24f','#4ff7f0'];

function fmt(n) {
  if (n >= 100000000) return (n/100000000).toFixed(1) + '억';
  if (n >= 10000)     return (n/10000).toFixed(0) + '만';
  return n.toLocaleString();
}

function showCards() {
  document.querySelectorAll('.kpi-card, .chart-card').forEach((el, i) => {
    setTimeout(() => el.classList.add('show'), i * 60);
  });
}

async function fetchData(type) {
  const res = await fetch(`${API}?type=${type}`);
  return res.json();
}

function renderKPI(d) {
  document.getElementById('kpi-orders').textContent  = d.totalOrders.toLocaleString();
  document.getElementById('kpi-revenue').textContent = fmt(d.totalRevenue);
  document.getElementById('kpi-qty').textContent     = d.totalQty.toLocaleString();
  document.getElementById('kpi-avg').textContent     = fmt(d.avgOrderValue);
  document.getElementById('kpi-lowstock').textContent= d.lowStockCount;
  document.getElementById('kpi-reorder').textContent = d.reorderCount;
}

function chartBase() {
  return {
    plugins: { legend: { labels: { color: '#6b7490', font: { family: 'Noto Sans KR', size: 11 }, boxWidth: 12 } } },
    scales: {
      x: { ticks: { color: '#6b7490', font: { size: 11 } }, grid: { color: 'rgba(37,44,61,0.8)' } },
      y: { ticks: { color: '#6b7490', font: { size: 11 }, callback: v => fmt(v) }, grid: { color: 'rgba(37,44,61,0.8)' } }
    }
  };
}

function renderMonthly(data) {
  new Chart(document.getElementById('chart-monthly'), {
    type: 'bar',
    data: {
      labels: data.map(d => d.month),
      datasets: [{
        label: '매출액',
        data: data.map(d => d.revenue),
        backgroundColor: 'rgba(79,142,247,0.25)',
        borderColor: '#4f8ef7',
        borderWidth: 2,
        borderRadius: 4,
      }]
    },
    options: { ...chartBase(), responsive: true, maintainAspectRatio: true }
  });
}

function renderCategory(data) {
  new Chart(document.getElementById('chart-category'), {
    type: 'doughnut',
    data: {
      labels: data.map(d => d.category),
      datasets: [{
        data: data.map(d => d.revenue),
        backgroundColor: COLORS.map(c => c + '99'),
        borderColor: COLORS,
        borderWidth: 2,
        hoverOffset: 8
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { position: 'bottom', labels: { color: '#6b7490', font: { family: 'Noto Sans KR', size: 11 }, boxWidth: 12, padding: 16 } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${fmt(ctx.parsed)}원 (${data[ctx.dataIndex].ratio}%)` } }
      }
    }
  });
}

function renderChannel(data) {
  new Chart(document.getElementById('chart-channel'), {
    type: 'bar',
    data: {
      labels: data.map(d => d.channel),
      datasets: [{
        label: '매출액',
        data: data.map(d => d.revenue),
        backgroundColor: COLORS.map(c => c + '80'),
        borderColor: COLORS,
        borderWidth: 2,
        borderRadius: 4,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#6b7490', font: { size: 10 }, callback: v => fmt(v) }, grid: { color: 'rgba(37,44,61,0.8)' } },
        y: { ticks: { color: '#6b7490', font: { size: 11 } }, grid: { display: false } }
      }
    }
  });
}

function renderRep(data) {
  const max = data[0]?.revenue || 1;
  const list = document.getElementById('rep-list');
  list.innerHTML = data.map((d, i) => `
    <div class="rep-item">
      <div class="rep-rank ${i === 0 ? 'top' : ''}">0${i+1}</div>
      <div class="rep-info">
        <div class="rep-name">${d.rep} <span style="color:var(--muted);font-size:11px;">(${d.orders}건)</span></div>
        <div class="rep-bar-wrap">
          <div class="rep-bar" style="width:${Math.round(d.revenue/max*100)}%"></div>
        </div>
      </div>
      <div class="rep-amount">${fmt(d.revenue)}<span style="font-size:11px;color:var(--muted);">원</span></div>
    </div>
  `).join('');
}

function renderInventory(data) {
  const tbody = document.getElementById('inventory-body');
  tbody.innerHTML = data.map(d => {
    const cur  = Number(d['현재재고']);
    const safe = Number(d['안전재고']);
    let badge = '';
    if      (cur < safe)        badge = '<span class="badge badge-bad">부족</span>';
    else if (cur < safe * 1.5)  badge = '<span class="badge badge-warn">주의</span>';
    else                         badge = '<span class="badge badge-ok">정상</span>';
    return `<tr>
      <td style="color:var(--muted);font-size:12px;">${d['제품코드']}</td>
      <td style="font-weight:500;">${d['제품명']}</td>
      <td style="color:var(--muted);">${d['카테고리']}</td>
      <td style="font-family:'Bebas Neue';font-size:18px;">${cur.toLocaleString()}</td>
      <td style="color:var(--muted);">${safe.toLocaleString()}</td>
      <td>${Number(d['총입고']).toLocaleString()}</td>
      <td>${Number(d['총출고']).toLocaleString()}</td>
      <td>${badge}</td>
    </tr>`;
  }).join('');
}

async function init() {
  try {
    const [all, rep] = await Promise.all([
      fetchData('all'),
      fetchData('rep')
    ]);

    renderKPI(all.kpi);
    renderMonthly(all.monthly);
    renderCategory(all.category);
    renderChannel(all.channel);
    renderRep(rep);
    renderInventory(all.inventory);

    document.getElementById('update-time').textContent =
      '업데이트: ' + new Date().toLocaleString('ko-KR');

    // 로딩 숨기기
    const loading = document.getElementById('loading');
    loading.style.opacity = '0';
    setTimeout(() => loading.style.display = 'none', 500);

    showCards();

  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<div style="color:#f74f7a;font-family:'Bebas Neue';font-size:24px;letter-spacing:4px;">DATA LOAD FAILED</div>
       <div style="color:#6b7490;margin-top:12px;font-size:13px;">${e.message}</div>`;
  }
}

init();
</script>
</body>
</html>
